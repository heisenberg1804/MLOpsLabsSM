#logstash_pipeline/logstash.conf
input {
  file {
    # This path is INSIDE the Docker container,
    # which we map to your Mac directory in the docker-compose file.
    path => "/mnt/logs/inference.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    stat_interval => "3s"
  }
}

filter {
  # Convert fields to the correct data type for Kibana
  mutate {
    convert => {
      "inference_time_ms" => "float"
      "prediction_confidence" => "float"
      "cpu_usage" => "float"
      "memory_usage_mb" => "integer"
    }
  }
}

output {
  elasticsearch {
    # This 'elasticsearch' hostname is the service name
    # from the docker-compose file.
    hosts => ["http://elasticsearch:9200"]
    index => "ml-inference-logs"
  }
  stdout {
    codec => rubydebug
  }
}
